services:
  - type: web
    name: network-cards-system
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: network-cards-system-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

databases:
  - name: network-cards-system-db
    databaseName: network_cards
    user: network_cards
    region: frankfurt
    plan: basic-256mb
